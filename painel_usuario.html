<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Oficina - ONFICINA</title>
    <link rel="icon" href="assets/img/icon_Onficina.png">
    <link rel="stylesheet" href="style.css"> <!-- Arquivo CSS externo -->
</head>
<body class="painel-usuario">
    <header>
        <h1>Bem vindo, <span id="nome_usuario">Usuário</span>!</h1>
        <form method="POST" action="painel_usuario.php">
            <button class="logout" name="logout">Sair</button>
        </form>
    </header>
    <div class="container">
        <div class="card">
            <h2>Meus Veículos</h2>
            <ul id="veiculos-list">
                <!-- Lista de veículos será preenchida pelo PHP -->
            </ul>
            <a href="cadastrar_veiculo_usuario.html" class="cadastrar">Cadastrar novo veículo</a>
        </div>
    </div>

    <script>
        function carregarDados() {
            fetch('painel_usuario.php')
                .then(response => response.text())
                .then(data => {
                    const nomeUsuario = data.match(/Nome do Usuário: (.+)/); 
                    if (nomeUsuario) {
                        document.getElementById('nome_usuario').innerText = nomeUsuario[1];
                    }

                    const listaVeiculos = data.match(/<li>(.*?)<\/li>/g);
                    const veiculosList = document.getElementById('veiculos-list');
                    if (listaVeiculos) {
                        veiculosList.innerHTML = listaVeiculos.join('');
                    }
                });
        }
        window.onload = carregarDados;
    </script>
</body>
</html>
